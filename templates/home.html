
{% extends 'base.html' %}

{% block title %}Student Registration | FINDit{% endblock %}

{% block extra_css %}
<style>
    .registration-wrapper {
        max-width: 850px;
        margin: 0 auto;
    }

    .registration-card {
        background: #fff;
        border: 1px solid #ececf5;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 35px rgba(30, 15, 130, 0.07);
    }

    .registration-header {
        background: linear-gradient(120deg, #1900b8, #3924d8);
        color: white;
        padding: 30px;
    }

    .registration-header h1 {
        font-size: 27px;
        font-weight: 750;
        margin-bottom: 8px;
    }

    .registration-header p {
        font-size: 14px;
        color: #e5e2ff;
        margin-bottom: 0;
    }

    .form-body {
        padding: 32px;
    }

    .section-title {
        color: #1900b8;
        font-size: 17px;
        font-weight: 700;
        padding-bottom: 10px;
        margin-bottom: 20px;
        border-bottom: 1px solid #eeeeF5;
    }

    .form-label {
        font-size: 13px;
        font-weight: 600;
        color: #38394a;
        margin-bottom: 8px;
    }

    .form-control, .form-select {
        min-height: 45px;
        border-radius: 9px;
        border-color: #dedfeb;
        font-size: 14px;
    }

    .form-control:focus, .form-select:focus {
        border-color: #1900b8;
        box-shadow: 0 0 0 3px rgba(25, 0, 184, 0.09);
    }

    .help-text {
        font-size: 12px;
        color: #777b8b;
        margin-top: 6px;
    }

    .upload-box {
        background: #f8f7ff;
        border: 1px dashed #b8b0f4;
        padding: 17px;
        border-radius: 10px;
    }

    .btn-register {
        background: #1900b8;
        color: #fff;
        border: none;
        border-radius: 9px;
        padding: 13px 22px;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-register:hover {
        background: #ff751f;
        color: #fff;
    }

    .errorlist {
        color: #dc3545;
        font-size: 12px;
        padding-left: 18px;
        margin-top: 6px;
    }

    @media (max-width: 576px) {
        .registration-header, .form-body {
            padding: 23px 18px;
        }

        .registration-header h1 {
            font-size: 23px;
        }
    }
</style>
{% endblock %}

{% block content %}
<h1>This is home</h1>
{% endblock %}
