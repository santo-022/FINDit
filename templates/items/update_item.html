
{% extends 'base.html' %}

{% block title %}Update Item | FINDit{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="content-card">

            <h2 class="page-title">Update Item</h2>

            <p class="page-subtitle">
                Update the information of your reported item.
            </p>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-findit">
                    Save Changes
                </button>

                <a href="{% url 'student_dashboard' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>
</div>

{% endblock %}
